name: img_txt_testcase
percent: 1
length: 4270 # images
length_multiplier: 1
length_divisor: 1
target: cogdata.streaming.MetaDistributedWebDataset
params:
  process_fn:
    target: cogdata.streaming.processfns.ImageTextPairProcessFnBuilder
    params:
      img_size: ${variables:img_size}
      max_text_len: ${variables:max_text_len}
      tokenizer_name: ${variables:tokenizer_name}
  meta_names: ["caption", "caption_zh"]
  path: downloads/streaming/img_data/test0{00..35}.tar
  